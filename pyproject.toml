[project]
name = "loop_fixer"
version = "0.1.0"
description = "Deterministic FSM agent loop that fixes a failing pytest test."
requires-python = ">=3.9"
dependencies = [
    "pytest>=7.0",
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
]

[project.optional-dependencies]
mcp = ["mcp>=1.6,<2.0", "anyio>=4.0"]

[project.scripts]
loop-fixer = "loop_fixer.cli:main"
loop-fixer-mcp = "loop_fixer.mcp_server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loop_fixer*"]

[tool.setuptools.package-data]
loop_fixer = ["prompts/*.txt"]

[tool.pytest.ini_options]
addopts = "--ignore=tests/fixtures"
