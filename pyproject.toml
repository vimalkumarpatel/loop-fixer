[project]
name = "loop_fixer"
version = "0.1.0"
description = "Deterministic FSM agent loop that fixes a failing pytest test."
requires-python = ">=3.9"
dependencies = [
    "pytest>=7.0",
    "anthropic>=0.40",
]

[project.scripts]
loop-fixer = "loop_fixer.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loop_fixer*"]

[tool.setuptools.package-data]
loop_fixer = ["prompts/*.txt"]

[tool.pytest.ini_options]
addopts = "--ignore=tests/fixtures"
